<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LED 화면 예시 - 로비 안내</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; }
  body {
    width: 840px; height: 1880px; overflow: hidden;
    font-family: "Wanted Sans", sans-serif; color: #f4efe6;
    background:
      radial-gradient(120% 60% at 20% 0%, #3b3f45 0%, transparent 70%),
      linear-gradient(180deg, #23272b 0%, #15181b 100%);
    display: flex; flex-direction: column; padding: 120px 84px; box-sizing: border-box;
  }
  .hello { font-size: 128px; font-weight: 800; line-height: 1.08; letter-spacing: -0.03em; margin: 0; }
  .rule { width: 120px; height: 10px; background: #d0ae78; margin: 72px 0 64px; }
  .label { font-size: 44px; font-weight: 600; color: #d0ae78; margin: 0 0 28px; }
  .item { font-size: 58px; font-weight: 700; line-height: 1.3; margin: 0; }
  .item small { display: block; font-size: 42px; font-weight: 500; color: #c9c3b8; margin-top: 10px; }
  .gap { height: 56px; }
</style>
</head>
<body>
  <p class="hello">어서<br>오세요</p>
  <div class="rule"></div>
  <p class="label">오늘 일정</p>
  <p class="item">14:00<small>협력사 설명회<br>3층 세미나실</small></p>
  <div class="gap"></div>
  <p class="item">16:30<small>신규 입주사 안내<br>1층 라운지</small></p>
</body>
</html>
