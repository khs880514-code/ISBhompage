<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LED 화면 예시 - 라운지 안내</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; }
  body {
    width: 760px; height: 3080px; overflow: hidden; position: relative;
    font-family: "Wanted Sans", sans-serif; color: #fff; background: #1b1e21;
  }
  .photo {
    position: absolute; inset: 0 0 auto 0; height: 2050px;
    background: url("../img/source/pod-meeting-lounge.jpg") 58% 50% / auto 100% no-repeat;
  }
  .photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,22,25,0) 55%, rgba(20,22,25,.92) 100%); }
  .text { position: absolute; left: 70px; right: 60px; top: 1640px; }
  h1 { font-size: 104px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 36px; }
  p { font-size: 50px; font-weight: 500; line-height: 1.4; margin: 0; color: #e9e3d8; }
  .floor { position: absolute; left: 70px; top: 2230px; font-size: 180px; font-weight: 800; color: #d0ae78; letter-spacing: -0.03em; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="text">
    <h1>회의 부스<br>예약 없이<br>쓰세요</h1>
    <p>2층 라운지 창가</p>
  </div>
  <div class="floor">2F</div>
</body>
</html>
